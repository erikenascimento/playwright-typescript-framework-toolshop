name: Playwright Tests
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Unauthenticated tests
      run: npx playwright test --project unauth-ui-chrome
    - name: Run API tests
      run: npx playwright test --project api
    # - name: Run Authenticated tests
    #   run: npx playwright test --project auth-ui-chrome
      # env: 
      #   USER_CUSTOMER2_EMAIL: ${{ secrets.USER_CUSTOMER2_EMAIL }}
      #   USER_CUSTOMER2_PASSWORD: ${{ secrets.USER_CUSTOMER2_PASSWORD }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
